[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brickschema-rdflib-sqlalchemy"
version = "0.6.2"
description = "rdflib extension adding SQLAlchemy as an AbstractSQLStore back-end store"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD" }
authors = [
    { name = "Gabe Fierro", email = "gtfierro@mines.edu" },
    { name = "Graham Higgins", email = "gjhiggins@gmail.com" },
    { name = "Adam Ever-Hadani", email = "adamhadani@globality.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "alembic>=0.8.8",
    "rdflib>=6,<8",
    "SQLAlchemy>=2.0.23",
]

[project.urls]
Homepage = "https://github.com/gtfierro/rdflib-sqlalchemy"

[project.entry-points."rdf.plugins.store"]
SQLAlchemy = "rdflib_sqlalchemy.store:SQLAlchemy"

[dependency-groups]
dev = [
    "flake8>=5.0.4",
    "pytest>=8.0.0",
    "tox>=4.12.1",
]

[tool.setuptools]
packages = ["rdflib_sqlalchemy"]
